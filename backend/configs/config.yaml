# 应用配置
app:
  name: jikeai-clone
  version: 0.1.0
  port: 8080
  mode: debug # debug / release
  # 生成产物转存目录：上游（RunningHub）的结果 URL 24 小时失效，
  # 任务 SUCCESS 后立即下载到这里，库里存本地 URL
  #
  # 用 ~ 表示当前用户主目录，由 config.Load 展开（Windows = C:\Users\<你>，
  # macOS/Linux = /home/<你>）。这样配置文件跨平台、跨机器都能直接跑，
  # 不用每换一台机器就手改绝对路径。
  result_dir: "~/.jikeai-clone-data/results"
  result_url_prefix: "/static/results"
  # 任务并发上限：一个任务一个协程，有多少任务就同时提交多少；
  # 上游并发/排队由网关自己处理（queueTimeoutMs），本地不节流。
  # 这个值只是防失控兜底，正常批量远小于它。
  max_concurrent_tasks: 200
  # 分镜草图专用图像模型（管理端「模型配置」里的 ID）。
  # 草图要求「纯黑白线条、构图准确」，和出资产图的模型诉求不同，单独指定。
  # 留空则回退到图像分类的默认模型。当前：doubao-seedream-5.0-pro
  sketch_model_id: "384122f1-ef2f-476b-b6f6-4a2ccea94858"
  # ffmpeg 可执行文件路径：成片合成（把一集的多段分镜按顺序拼成一条）要用。
  # 留空或写 "ffmpeg" 就走系统 PATH；PATH 里没有时填绝对路径，
  # 如 "D:/ffmpeg/bin/ffmpeg.exe"。未安装时合成接口会返回明确报错，不影响其他功能。
  ffmpeg_path: "ffmpeg"

# 数据库配置
database:
  # 用 SQLite：两台电脑轮流开发，整个数据目录放网盘同步。
  # SQLite 是单文件，网盘直接同步就行；PostgreSQL 的数据目录没法跨机拷。
  driver: sqlite
  # 只写文件路径，不带 ?_journal_mode=... 这类驱动私有参数：
  # WAL / busy_timeout 等 PRAGMA 统一在 database.Init 里执行。
  #
  # 想改成网盘目录就把这一行换成绝对路径，例如：
  #   dsn: "D:/OneDrive/jikeai-data/jikeai.db"
  # 同时把上面 app.result_dir 也指到同一个父目录下，两边保持一致。
  dsn: "~/.jikeai-clone-data/jikeai.db"

# Redis 配置（可选，用于缓存和队列）
redis:
  enabled: false
  addr: localhost:6379
  password: ""
  db: 0

# JWT 配置
jwt:
  secret: your-secret-key-change-in-production
  expire: 86400 # 24小时

# 积分系统
points:
  identify_cost: 14 # 识别角色/场景
  image_per_cost: 2 # 每张图片成本
  video_per_cost: 35 # 视频生成成本

# AI 服务配置（后续对接）
ai:
  openai:
    api_key: ""
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o"
  runninghub:
    api_key: ""
    base_url: "https://www.runninghub.cn"
  doubao:
    api_key: ""
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
